# Rules-as-written (game_rules.md §2) — one shared 52-card deck.
#
# 52 - 6 base - 10 hand - 10 removed = a 26-card shared draw pile that both players draw
# from, alternating 13/13.
#
# This is the published game. It is NOT the project default (see configs/split.toml) —
# it exists so the split-deck variant's effect can be measured against something.
#
# One consequence specific to this variant: a card bottomed by the 2 goes into the *shared*
# pile, so it may come back to your opponent rather than to you (§10a). That makes the 2
# strictly more interesting here than in the split variants.
#
#   duel52 play  --config configs/base.toml
#   duel52 stats --config configs/base.toml --games 20000

variant = "base"
two_power = "bottom"

lanes = 3
lanes_to_win = 2

# The theoretical maximum for this variant: 52 total, minus the 10 removed unseen, minus
# the opponent's opening 5 and their 3 base cards.
max_slots_per_side = 34

max_rank_index = 12
copies_per_rank = 4
hand_size = 5
base_cards_per_player = 3

# The base game removes 10 from the shared deck; the split variants remove 5 per player.
removal_count = 10

actions_per_turn = 3
first_turn_actions = 2
draws_per_turn = 1
stalemate_quiet_plies = 20
max_plies = 2000
