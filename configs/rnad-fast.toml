# PLAN.md item 8, Stage 3 — the R-NaD smoke run. Minutes on the laptop.
#
#   .venv/bin/python -m duel52.rnad check --config configs/rnad-fast.toml
#   .venv/bin/python -m duel52.rnad run   --config configs/rnad-fast.toml --run-dir runs/rnad-fast
#
# It proves the loop end to end on the real game and the real trunk: games through the
# engine's GameBatch, a learner step, a regularisation update (the schedule is shortened so
# several happen), an evaluation match through `netsample`, a saved state that resumes. It
# does not train anything worth playing — that is `rnad-3h.toml`, on a GPU.

[game]
variant = "split"
encoding_slots = 21
stalemate_value = 0.0

[net]
arch = "lane"
width = 128
blocks = 3
value_hidden = 128

[rnad]
device = "auto"
batch_games = 32
# Shortened from the reference's 20,000 so a smoke run crosses two updates, with the target
# average raised to match (τ·size = 5) — see configs/rnad-3h.toml for why the two move together.
entropy_schedule_size = [20]
entropy_schedule_repeats = [1]
target_network_avg = 0.25
learning_rate = 5e-4

[run]
hours = 0.25
max_steps = 40
seed = 7000000
log_every = 5
eval_every = 20
eval_games = 40
eval_opponents = ["random", "greedy"]
save_every_secs = 60.0
