# Mirrored removal (game_rules.md §9b) — the deterministic variant.
#
# As the split deck, but both players remove the SAME multiset of ranks, and that multiset
# is REVEALED to both players at setup. The two decks are then rank-identical.
#
# The reveal is the strategically important part: the unseen pool collapses to "opponent's
# hand + the six base cards", so belief tracking runs over a known set of ranks. That makes
# this the cleanest target for equilibrium analysis, and the best form of the game for
# asking "what does optimal play look like" as a question about skill rather than luck.
#
# Setup order differs from §9a out of necessity: the shared removal multiset is drawn first
# and stripped from both decks, and only then are base cards and hands dealt. Doing it in
# 9a's order is not always feasible — a rank can be gone from one player's pile while still
# present in the other's, leaving no mirrored set to remove.
#
#   duel52 play  --config configs/mirrored.toml
#   duel52 stats --config configs/mirrored.toml --games 20000

variant = "mirrored"
two_power = "bottom"

lanes = 3
lanes_to_win = 2
max_slots_per_side = 21
max_rank_index = 12
copies_per_rank = 4
hand_size = 5
base_cards_per_player = 3
removal_count = 5

actions_per_turn = 3
first_turn_actions = 2
draws_per_turn = 1
stalemate_quiet_plies = 20
max_plies = 2000
