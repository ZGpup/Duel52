# Split deck (game_rules.md §9a) — THE PROJECT DEFAULT.
#
# Each player owns one colour: 26 cards, ranks A-K twice, and draws only from their own
# pile. Per player: 26 - 3 base - 5 hand - 5 removed = a 13-card personal draw pile.
# Totals match the base game exactly (10 removed overall, 26 cards of draw).
#
# Why this is the default rather than the published rules: the shared pile of the base game
# means the two players can face materially different card distributions. Splitting removes
# that source of variance, which makes first-player advantage cleanly measurable and cuts
# the number of self-play games needed for the same signal.
#
#   duel52 play  --config configs/split.toml
#   duel52 stats --config configs/split.toml --games 20000

variant = "split"

# The 2 bottoms rather than discards (game_rules.md §10a). House rule, default everywhere.
# Set to "discard" for rules-as-written; see configs/split-raw-two.toml.
two_power = "bottom"

lanes = 3
lanes_to_win = 2

# Not a rule — the rules impose no limit on cards per lane per side (§1). This is the
# theoretical maximum (26 owned minus 5 removed), so the engine's assertion can never fire.
max_slots_per_side = 21

max_rank_index = 12
copies_per_rank = 4
hand_size = 5
base_cards_per_player = 3
removal_count = 5

actions_per_turn = 3
first_turn_actions = 2
draws_per_turn = 1

# [ENGINE] The published rules define no draw. Consecutive plies with no damage and no
# kill, after which one is declared. 20 plies is ten turns apiece.
stalemate_quiet_plies = 20

# [ENGINE] Safety cap. Should be unreachable; if it fires, that is a bug report.
max_plies = 2000
