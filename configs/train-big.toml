# Phase 4's run — PLAN.md §4.3, sized for a 64-core rented box and 24 hours.
#
#   .venv/bin/python -m duel52.train check --config configs/train-big.toml
#   .venv/bin/python -m duel52.train run --config configs/train-big.toml --run-dir runs/big
#   .venv/bin/python -m duel52.train run --config configs/train-big.toml --run-dir runs/big --resume
#
# **Do not start this without doing PLAN.md §4.5 Stage 1 first.** Every number below is
# derived from `games/hour ≈ 28,000 × (cores / 8) × (64 / sims) × trunk_factor`, which is
# calibrated on this project's own runs and on nobody else's hardware. Stage 1 measures the
# box's real core count in about ten minutes; `selfplay.games` is then re-derived from the
# measurement and only then is the long run worth starting.
#
# At 64 cores this is ~37,500 games/hour, ~15,000 a generation, ~29 minutes a generation and
# ~48 generations in 24 hours — 13× the first run's games with 4× the search in each, so
# roughly 50× the teacher compute. `configs/train-2h.toml` is the same seven changes on a
# laptop, and it is worth running first: it is free and it has caught things.
#
# This run starts from a **random init**, and now for a second and stronger reason: it is
# lane-equivariant (`arch = "lane"`), which shares no tensor name with the flat network every
# shipped checkpoint is. `--init-from` refuses across the two by name. The gen031 reference
# column below is therefore the run's progress chart rather than a formality.
#
# ⚠️ **Rebuilt after `runs/sixth` (FINDINGS.md F4.6).** Four things changed, and three of them
# are corrections to mistakes this file would otherwise have repeated at 24-hour scale:
#
#   1. `arch = "lane"` and playout cap randomisation, the two changes F4.6 validated.
#   2. `net.blocks` is now **a Stage 1 measurement, not a constant** — the throughput table
#      this file used to quote is for the *flat* network and does not describe what it would
#      now be running. See `[net]`.
#   3. `holdout_generation` is no longer 1. F4.6's most important operational finding is that
#      a from-scratch run's generation-1 holdout is built from random play and becomes noise
#      within a few generations — `runs/sixth` had no trustworthy internal diagnostic at all.
#   4. `lr_schedule` is keyed to the generations this run will *actually finish*. F4.6 lost
#      three generations to a schedule keyed to a length the run never reached, and the fix
#      tripled the slope. That is the cheapest mistake on this list to avoid and the easiest
#      to make.

[game]
variant = "split"
encoding_slots = 21               # FINDINGS.md F3.1; also what fixes obs_dim
stalemate_value = 0.0             # FINDINGS.md F3.6

[net]
# **The lane-equivariant network** — PLAN.md §4.2b, FINDINGS.md F4.6. The trunk runs once per
# lane with one shared set of weights and the lanes interact only through their mean, so a
# lane preference is unrepresentable rather than merely small: `runs/sixth` measured policy TV
# 0.000 and agreement 128/128, against gen031's augmented 0.039 and 114/128, and those hold on
# a random init and do not erode with training.
arch = "lane"

# ⚠️ **`blocks` is a Stage 1 measurement, not the constant it looks like, and the old
# throughput table here was for the flat network.** Reasoning from parameters is the trap
# F4.6 walked into: the input projection is 58% of a flat checkpoint's weights and does not
# grow under lane sharing, so depth *looks* cheap. It is not, because in the search path the
# input layer walks only the observation's ~205 non-zeros and the policy head is masked to the
# ~21 legal logits. **The trunk is the whole cost, and it now runs three times per position.**
#
# Measured on the 8-core laptop, 40 games at 256 sims (F4.6):
#
#   flat 128x3 (gen031), no capping    2.0 games/sec   1.00x
#   lane 128x3 + capping               2.0             1.00x
#   lane 128x4 + capping               1.7             0.85x
#   lane 128x6 + capping               1.2             0.60x
#   lane 128x6, no capping             0.5             0.25x
#
# 3 blocks is what three laptop hours could afford. **This box is the reason to go deeper**,
# and 6 is the hypothesis rather than the answer — Stage 1 must re-measure `lane 128x{3,4,6}`
# with capping on, on the rented box, and this number set from that. Prefer depth to width:
# width costs the trunk quadratically and the trunk is already tripled.
width = 128
blocks = 6
value_hidden = 128

[selfplay]
# 15,000 at 64 cores is ~24 minutes of self-play in a ~29-minute generation, which puts the
# run in the 40–50 generation band PLAN.md §4.3 asks for. **Re-derive this from Stage 1's
# measured throughput**; it is the one number in this file that is about the box.
games = 15000

# PLAN.md §4.2 change 3, and the reason the whole run is shaped the way it is. The policy
# target is the visit distribution, so training at 64 sims teaches the network to imitate a
# search ~370 Elo weaker than the same weights produce at 4096 (F3.8). 256 rather than 1024
# because 64 → 256 is the cheapest large gain (+141 Elo) and the return per 4× halves above
# 1024. Cost is close to linear.
sims = 256
c_puct = 1.25

# **Playout cap randomisation** — PLAN.md §4.2c, FINDINGS.md F4.6. A quarter of decisions get
# the full 256 and a policy target; the rest get 32 and a value target only, which costs
# nothing extra because one game has one outcome however little search produced the position.
# Measured 4.0x cheaper search on the laptop, and it is what makes the equivariant trunk
# affordable at all.
#
# 0.25 rather than 0.4 was measured, not assumed: at a fixed self-play budget the games capping
# buys back nearly replace the policy targets it costs (~21k vs ~24k) while yielding 43% more
# *outcomes*, and outcomes are the scarce half — PLAN.md §4.2 change 7 has the value head as
# the plateaued one.
#
# ⚠️ **Re-derive `games` from this, not from the old flat-network formula.** The
# `games/hour ~= 28,000 x (cores/8) x (64/sims) x trunk_factor` estimate at the top of this
# file predates both changes: `sims` is now a *mean* of 88 rather than 256, and `trunk_factor`
# is the lane trunk's, which Stage 1 must measure.
full_search_fraction = 0.25
cap_sims = 32

dirichlet_alpha = 0.3
dirichlet_weight = 0.25
temperature = 1.0
# Stays at 24. This is ~18% of a ~136-decision game; AlphaZero samples ~19% for the same
# reason (clean value targets), so 24 is not obviously thin. If Stage 1 leaves spare
# compute, one short run at 40 against one at 24 is the cheapest ablation on the list.
temperature_decisions = 24

[train]
# "auto" resolves to CUDA on a rented box and MPS here. Worth knowing what it is and is not
# buying: F3.11 measured the gradient step at 1.4× faster on a GPU than on eight CPU cores,
# against self-play at 87% of the loop. `run.threads` matters more than this string.
device = "auto"
batch_size = 1024

# PLAN.md §4.3: keep the first run's ratio of sample-presentations to new samples
# (1200 × 512 ÷ 220k ≈ 2.8). At 15,000 games that is 1.02M new samples a generation, so
# 2.8 × 1.02M ÷ 1024 ≈ 2800 steps — about a minute. Fitting stays under 3% of the loop.
#
# ⚠️ **Expressed as epochs, because a fixed step count is a different number of passes over
# the data every time the buffer window is a different size — and the window ramps for the
# first `buffer_generations`.** At `steps_per_generation = 2800` this config did **3.0 epochs
# over a single random-init shard at generation 1** (`train check` prints it), which is within
# a hair of the four passes over a quarter-full buffer that made generation 1 of `runs/fourth`
# memorise its shard — see `TrainSettings.epochs_per_generation` in `py/duel52/train/config.py`.
# 0.47 is the 2.8 ratio above at six generations in the window, and unlike the step count it
# survives `selfplay.games` being re-derived from Stage 1 without anything else having to move.
epochs_per_generation = 0.47
steps_per_generation = 2800       # the fallback if `epochs_per_generation` is ever set to 0

lr = 2.0e-3
weight_decay = 1.0e-4
value_weight = 1.0
grad_clip = 1.0

# PLAN.md §4.2 change 5. A constant rate is fine for 19 generations and not for 50: full
# rate to 40% of the run, a quarter to 75%, a sixteenth after. Keyed to the generation
# index, because `--resume` rebuilds the Trainer and an optimiser step counter does not
# survive it — which on a preemptible box means a step-keyed schedule silently restarts at
# full learning rate every time the instance is reclaimed.
#
# ⚠️ **Key these to the generations the run will actually finish, from Stage 1's measured
# generation time — not to the 50 in `[run]`, which is a backstop.** This is the third time
# the project has made this mistake and F4.6 is the clearest measurement of what it costs:
# `runs/sixth`'s tiers were keyed to 7-8 generations, the run was extended, and generations
# 6-8 crawled at a sixteenth rate while the training loss was still falling monotonically —
# +0.055 on the reference column against +0.180 for the three generations after the boundary
# was moved. Moving one number tripled the slope.
#
# So: if Stage 1 says 29 minutes a generation, the run finishes ~48 and these numbers are
# right. If it says 45, the run finishes ~32 and they must become [[0,1.0],[13,0.25],[24,…]].
# Setting them to the backstop wastes the tail of the run at a rate that cannot learn.
lr_schedule = [[0, 1.0], [20, 0.25], [38, 0.0625]]

# 1.02M samples a generation at ~1.6 KB each, so six generations is 6.1M samples ≈ 10 GB —
# fits 64 GB with room. Raise `sample_stride` to 3 if RAM is tight; it costs little signal.
# **`buffer_samples` must be raised with `games`** or it silently truncates the window to a
# fraction of one generation, which is invisible in the readout.
sample_stride = 2
buffer_generations = 6
buffer_samples = 6500000

# PLAN.md §4.2 change 7. The policy loss fell for the whole first run; the value loss
# plateaued around generation 11 and then oscillated. That matters because search resolves
# the next few decisions and *everything past its horizon is the value head* — and a Duel 52
# game is ~130 decisions with the §7 seam at ply 25, so from the mid-draw phase the thing
# deciding whether a hoard is worth it is ~45 decisions away, far outside any tree. A fixed
# holdout is what turns "the value head plateaued" from suggestive into testable.
holdout_samples = 50000

# ⚠️ **Not generation 1, and this is FINDINGS.md F4.6's most important operational finding.**
# A from-scratch run plays generation 1 with a *random init*, and the agent leaves that
# distribution within a few generations. In `runs/sixth` the held-out value MSE rose
# monotonically 0.723 -> 1.002 while the training value loss fell 0.780 -> 0.469 and external
# strength climbed the whole way; at 1.002 a head that always predicted zero scores the same,
# so the number had become noise and the run was steered entirely on the gate and the panel.
#
# `runs/fourth` and `runs/fifth` never saw this because they were warm-started and their
# generation 1 was already strong play. This run is from scratch and will hit it.
#
# 8 is chosen so the holdout comes from a net that has at least beaten `greedy` — `runs/sixth`
# managed that at generation 3 and this run's generations are longer. The cost is no held-out
# score before generation 8, which is real and worth it: a diagnostic that is noise is worse
# than one that is absent, because it invites being read.
holdout_generation = 8

[gate]
# PLAN.md §4.2 change 1 — 600 games at 0.52, not 200 at 0.55. `check` prints the power:
# at 600 decisive games a true-0.500 candidate passes 16% of the time (harmless — the new
# weights are as good as the old) and a true-0.540 candidate passes 84% (the error that
# ended the first run, and five in a row of it ends this one).
games = 600
threshold = 0.52
min_decisive = 60                 # the same 10% of `games` the first run's 20-of-200 was

# 256, matching the *peak* of `selfplay.sims` rather than its mean.
#
# ⚠️ With capping on, "the budget they are trained for" is no longer one number — 75% of
# self-play decisions are played at 32. 256 is still right here, because the gate is what
# decides whether a checkpoint is promoted and 256 is the budget the agent will be *played*
# at. Worth knowing it is now a choice rather than the tautology the old comment made it.
sims = 256

# PLAN.md §4.2 change 2. `random` and `greedy` were both saturated at 1.000 by generation
# 19 of the first run — they detect a catastrophe and nothing else, which is worth keeping
# and is not a measurement. In `runs/sixth`, also from scratch, `greedy` was a real progress
# chart for three generations before saturating, which is why the discount below is keyed to
# the high-water mark rather than to those opponents' names.
#
# The third row is the one to watch: rising monotonically means the loop is working, and
# flat-or-falling while the mirror gate keeps passing is the exploitability signature §4.8
# tripwire 2 is looking for. When the new net saturates it (≥ 0.95 for several generations),
# freeze the current best and add it as a fourth entry.
#
# A veto, never a target.
# **gen031, not gen016.** gen016 was the incumbent when this file was written; gen031 beats it
# by +189 Elo end to end (F4.1, F4.5) and is the agent this run has to clear to be worth
# shipping. A gen016 column would spend 48 generations re-measuring a fight that is over.
#
# ⚠️ **Read this column's slope, never its level.** It scores gen031 at **@64** against the
# candidate's @256 — a deliberate 4:1 search handicap, because a from-scratch net reads 0.00
# against gen031@256 for many generations and a column pinned at zero says nothing. In
# `runs/sixth` this row reached 0.515 while the honest equal-simulation match was
# 0.3233 ± 0.0527, i.e. −128 Elo. F3.8 and F4.4 price 64 → 256 at ~+141 Elo, which is very
# nearly the whole gap. **The run's real result is an equal-sims match against gen031, run at
# the end** — not this column.
reference = ["random", "greedy", "netmcts:models/duel52-split-gen031.d52nn@64"]
reference_games = 300

# **A saturated row is re-run at 60 games, not 300.** Once a row's best-ever reaches 0.99 it
# has stopped being a measurement and become a one-bit check — did the agent fall off a
# cliff — and a bit does not need 300 games. Measured with
# `match --a netmcts:models/duel52-split-gen031.d52nn@256 --b {random,greedy} --games 120
# --encoding-slots 21 --seed 1` on the 8-core laptop: 6.1 games/s and 4.5 games/s, so the
# two saturated rows cost 46.3 s a generation. Here it is 300 → 60 on two of three rows.
#
# Keyed to the high-water mark rather than to the opponent's name, which matters *for this
# config specifically*: this is the from-scratch run, and in `runs/third` — also from
# scratch — `greedy` read 0.36 / 0.47 / 0.68 / 0.81 / 0.89 / 0.95 over its first seven
# generations. Trimming it by name would have thrown that away. It pays full rate until it
# earns the discount. A warm-started run starts saturated and pays 60 from generation 1.
#
# The trimmed row is still a veto: at 60 games against a 1.000 high-water mark and a 0.05
# tolerance, a truly-0.995 row false-vetoes 0.02% of the time, while a fall to 0.900 is
# caught 86% of the time and F3.6's actual collapse — `random` 0.929 → 0.600 — every time.
# `train check` prints these for whatever numbers are set here.
#
# Honest sizing: self-play is 15,000 games a generation here, so this is well under 1% of
# this run's wall clock. It is worth more on a laptop-shaped config (~2.4% of a train-3h
# generation), and it costs nothing either way.
reference_games_saturated = 60
reference_saturated_at = 0.99

# ⚠️ **0.10, and this is the correction most likely to decide whether the run finishes.** The
# veto fires when a row scores more than this below its best-ever, with no confidence interval
# on either side (`loop.py`, `judge`) — and the best-ever is a running maximum of noisy draws,
# so it is itself biased upward by roughly its own standard error. At 300 games near 0.5 that
# error is 0.029, which leaves 0.05 under two of them against a target that has already drifted.
#
# Simulated over 40 generations at 300 games, 40,000 trials, as P(veto per generation) and
# P(five in a row, which **ends the run**):
#
#   gen031@64 row's trajectory        tol 0.05          tol 0.10
#   rising fast, 0.10 -> 0.50         7.4%,  0.4%       0.2%, 0.0%
#   rising, 0.30 -> 0.50             17.7%,  6.0%       1.0%, 0.0%
#   nearly flat mid-range at 0.50    29.2%, 20.5%       2.5%, 0.1%
#   plateaued at 0.60                45.4%, 52.1%       5.8%, 0.5%
#
# At 0.05 a run whose progress row plateaus mid-range is a coin flip to be killed by its own
# panel. `runs/sixth` escaped only by being 13 generations with a row that climbed the whole
# way, and even so it came within 0.03 and 0.01 of the veto twice. A 48-generation run spends
# far longer in the flat part.
#
# The cost of widening is detection power on the *trimmed* rows, and `train check` prices it: a
# fall from 1.000 to 0.900 is caught 39% of the time rather than 86%. That is the right trade —
# a 0.100 slip against `random` is a wobble, and F3.6's actual collapse, `random` 0.929 -> 0.600,
# is still caught 100% of the time either way. Widening also *lowers* the trimmed rows' own
# false-veto rate, 2.98% -> 0.02% of generations for a truly-0.995 row.
reference_tolerance = 0.10

max_consecutive_refusals = 5

[run]
generations = 60                  # a backstop; `hours` is what binds
hours = 24

# The loop advances the seed by `selfplay.games` each generation, so this run spans
# 2,000,000–2,720,000. The first run occupies 1,000,000–1,057,000 and a collision would
# silently re-deal games the net has already trained on.
seed = 2000000

# **Set this from Stage 1's measured flattening point**, which is the box's real core
# count. 0 means every core, which is right when the box is yours alone and wrong when it
# is a shared or throttled instance.
threads = 0

engine = "./target/release/duel52"
