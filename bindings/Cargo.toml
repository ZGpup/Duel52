[package]
name = "duel52-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "PyO3 bindings for the Duel 52 engine"
license = "MIT"
publish = false

[lib]
# The compiled module is imported as `duel52._engine`; see the `[tool.maturin]` section of
# the repository-root pyproject.toml. The `#[pymodule]` function name must match this.
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
duel52-engine = { path = "../engine" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
